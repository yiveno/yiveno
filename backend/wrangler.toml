name = "yiveno"
main = "src/index.ts"
compatibility_date = "2026-07-31"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
# 每天北京时间 03:17（UTC 19:17）业务数据清理；每小时 :07 订阅对账（§A.3.2）
crons = ["17 19 * * *", "7 * * * *"]

# ===================== 可观测性配置 =====================
# 用于监控 Worker 的运行状况、性能和错误
# logs 与 traces 可同时开启（各自采样率独立配置）
[observability]
enabled = true
head_sampling_rate = 1  # 采样率：1 = 100%（开发阶段），生产环境可降低到 0.1

# 日志配置（已启用）
[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true           # 持久化存储日志
invocation_logs = true   # 记录每次调用的详细信息

# 追踪：可与 logs 并存；生产可按需开启并降低采样
[observability.traces]
enabled = false
persist = false
head_sampling_rate = 0

# 本地 `wrangler dev` / 默认部署用。生产见 [env.production]
# name 必须是 yiveno：`--env production` → 脚本名 yiveno-production。
# 若写成 yiveno-production 再加 --env production，会变成 yiveno-production-production。
[vars]
SUPABASE_URL = "https://ugxgxytykxblctsyulsg.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_2FY9uDfqNbLwUYXxgcu8lw_qQ8SEbXo"
REDIRECT_URI_ALLOWLIST = "https://yiveno.com,http://localhost:3001,http://localhost:3002"
AI_HOSTED_MODEL = "deepseek-v4-flash"
AI_HOSTED_MONTHLY_QUOTA = "999"
# 聊天补全 Provider（默认 deepseek；换厂商时改此值并实现对应 adapter）
AI_PROVIDER = "deepseek"
# 未配 AI Gateway 时的直连回退；配置了 AI_GATEWAY_* 后实际走 Gateway
DEEPSEEK_API_BASE = "https://api.deepseek.com"
# Cloudflare AI Gateway（Dashboard → AI → AI Gateway 创建名为 yiveno 的 gateway）
AI_GATEWAY_ACCOUNT_ID = "231a6a08dec7fe0133fbaac8c5e55b2a"
AI_GATEWAY_ID = "yiveno"
CLEANUP_SCHEDULED_ENABLED = "true"
CLEANUP_MEMORY_SYNC_BACKUPS_KEEP = "5"
CLEANUP_SOFT_DELETE_RETENTION_DAYS = "180"
DODO_PAYMENTS_ENVIRONMENT = "test_mode"
BILLING_FOUNDING_ENABLED = "false"

[[kv_namespaces]]
binding = "AI_USAGE_KV"
id = "7e3a0b3f52654b7194ed21015f1779c5"
preview_id = "1bc22ced5a424d55ad14ca9f748ba900"

[ai]
binding = "AI"

# Custom Domain 仅挂 production（`bun run deploy` → wrangler deploy --env production）。
# 顶层不声明 routes，避免默认/其它 env 误继承抢占域名。
[env.production]
workers_dev = true
routes = [{ pattern = "api.yiveno.com", custom_domain = true }]

[env.production.vars]
SUPABASE_URL = "https://ugxgxytykxblctsyulsg.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_2FY9uDfqNbLwUYXxgcu8lw_qQ8SEbXo"
REDIRECT_URI_ALLOWLIST = "https://yiveno.com,http://localhost:3001,http://localhost:3002"
AI_HOSTED_MODEL = "deepseek-v4-flash"
AI_HOSTED_MONTHLY_QUOTA = "999"
AI_PROVIDER = "deepseek"
DEEPSEEK_API_BASE = "https://api.deepseek.com"
AI_GATEWAY_ACCOUNT_ID = "231a6a08dec7fe0133fbaac8c5e55b2a"
AI_GATEWAY_ID = "yiveno"
CLEANUP_SCHEDULED_ENABLED = "true"
CLEANUP_MEMORY_SYNC_BACKUPS_KEEP = "5"
CLEANUP_SOFT_DELETE_RETENTION_DAYS = "180"
DODO_PAYMENTS_ENVIRONMENT = "test_mode"
BILLING_FOUNDING_ENABLED = "false"

[[env.production.kv_namespaces]]
binding = "AI_USAGE_KV"
id = "7e3a0b3f52654b7194ed21015f1779c5"
preview_id = "1bc22ced5a424d55ad14ca9f748ba900"

[env.production.ai]
binding = "AI"
