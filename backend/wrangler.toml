name = "ottersage"
main = "src/index.ts"
compatibility_date = "2024-10-01"
workers_dev = true

# ===================== 可观测性配置 =====================
# 用于监控 Worker 的运行状况、性能和错误
# 注意：日志和追踪是互斥的，只能启用其中一个
[observability]
enabled = true
head_sampling_rate = 1  # 采样率：1 = 100%（开发阶段），生产环境可降低到 0.1

# 日志配置（已启用）
[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true           # 持久化存储日志
invocation_logs = true   # 记录每次调用的详细信息

# 追踪配置（已禁用，因为与日志互斥）
[observability.traces]
enabled = false
persist = false
head_sampling_rate = 0

# 注意：Custom Domain 不支持路径/通配符，且本地开发无需 routes。
# 为避免 wrangler dev 校验失败，将自定义域名路由仅放在 production 环境里。

# 共享配置（所有环境）
# 注意：以下变量将由 Cloudflare Secrets 自动替换。
# 在本地开发时，`wrangler dev` 会从 .dev.vars 文件中读取这些值。
[vars]
SUPABASE_URL = "https://ugxgxytykxblctsyulsg.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_2FY9uDfqNbLwUYXxgcu8lw_qQ8SEbXo"
REDIRECT_URI_ALLOWLIST = "https://ottersage.com,http://localhost:3001,http://localhost:3002"
AI_HOSTED_MODEL = "deepseek-v4-flash"
AI_HOSTED_MONTHLY_QUOTA = "999"
DEEPSEEK_API_BASE = "https://api.deepseek.com"

[[kv_namespaces]]
binding = "AI_USAGE_KV"
id = "7e3a0b3f52654b7194ed21015f1779c5"
preview_id = "1bc22ced5a424d55ad14ca9f748ba900"

[ai]
binding = "AI"

# Production 环境配置
routes = [
  { pattern = "api.ottersage.com", custom_domain = true }
]
