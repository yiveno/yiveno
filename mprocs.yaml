# 本地三端并行开发（TUI：上下键切换进程输出）
# 用法：bun run watch（`bun run dev` 同义）
# 需本机已安装 mprocs（brew install mprocs，或见 README）
# 无 TUI 时用：bun run watch:stream
# extension 为 vite build --watch：content IIFE 按需重打（仅 content/core/infra）；
# 重建后到 chrome://extensions 刷新扩展（MV3 无热替换；日志会提示）

procs:
  extension:
    shell: bun run watch:extension
    stop: SIGTERM
  worker:
    shell: bun run dev:worker
    stop: SIGTERM
  web:
    shell: bun run dev:web
    stop: SIGTERM

scrollback: 5000
mouse_scroll_speed: 3
proc_list_width: 12
