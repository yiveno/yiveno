name: E2E Extension Smoke

on:
  workflow_dispatch:
    inputs:
      EXT_ID:
        description: Chrome Extension ID
        required: true
      HOST:
        description: Chrome DevTools host (e.g., http://localhost:9222)
        required: false
        default: http://localhost:9222

jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      EXT_ID: ${{ inputs.EXT_ID }}
      HOST: ${{ inputs.HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build extension
        run: bun run build:fe

      - name: Run E2E smoke (popup + settings + recall card)
        run: bun ./scripts/e2e-management.mjs --ext "$EXT_ID" --host "$HOST"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: artifacts/**
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          echo "## E2E Extension Smoke" >> $GITHUB_STEP_SUMMARY
          echo "- EXT_ID: $EXT_ID" >> $GITHUB_STEP_SUMMARY
          echo "- HOST: $HOST" >> $GITHUB_STEP_SUMMARY
          echo "- Targets: popup.html, settings.html, popup recall→result card" >> $GITHUB_STEP_SUMMARY
