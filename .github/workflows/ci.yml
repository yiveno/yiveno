# Yiveno CI（对齐 AGENTS.md 质量门禁矩阵）
# PR / push main：typecheck:ci + lint + i18n + knip + FE/BE test + FE build
# 不在此跑：bun audit、全仓 typecheck:force；扩展 UI 验收走 MCP 真机（非 CI）

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BUN_VERSION: latest

jobs:
  quality-check:
    name: Quality (typecheck / lint / i18n / knip / test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      # packages + backend + website；FE 整图（app+node+vitest）由 build-test 内 vue-tsc -b 覆盖
      - name: Typecheck (ci)
        run: bun run typecheck:ci

      - name: Lint (eslint + stylelint)
        run: bun run lint:check

      - name: i18n key check
        run: bun run i18n:check

      - name: Doc drift check
        run: bun run doc:check:all

      - name: Knip
        run: bun run knip

      - name: Frontend tests
        run: cd frontend && bun run test:run

      - name: Backend tests
        run: cd backend && bun run test

  build-test:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      # CI 用 development build（含 vue-tsc -b）；发版用本地/手动 build:fe:prod
      - name: Build extension
        run: cd frontend && bun run build

      - name: Verify dist
        run: |
          cd frontend
          test -d dist || { echo "dist missing"; exit 1; }
          test -f dist/manifest.json || { echo "manifest.json missing"; exit 1; }
          test -f dist/background.js || { echo "background.js missing"; exit 1; }
          TOTAL_SIZE_KB=$(du -sk dist | cut -f1)
          echo "dist size: ${TOTAL_SIZE_KB}KB"
          if [ "$TOTAL_SIZE_KB" -gt 20480 ]; then
            echo "exceeds Chrome Web Store 20MB limit"
            exit 1
          fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7
