# Yiveno CI（对齐 AGENTS.md / project.mdc 质量门禁矩阵）
# PR / push main：typecheck:ci + lint + i18n + knip + extension/worker test + explicit test:must + extension build
# 不在此跑：bun audit、全仓 typecheck:force、真实 LLM/BGE（见 recall-real-eval.yml · workflow_dispatch）
# 扩展 UI 验收走 MCP 真机（非 CI）

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BUN_VERSION: latest
  # eval/*.test.ts 数量地板：防止目录搬迁/清空后 test:must 仍「0 tests 假绿」
  RECALL_EVAL_TEST_FILE_FLOOR: '8'

jobs:
  quality-check:
    name: Quality (typecheck / lint / i18n / knip / test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      # packages + worker + website；extension 整图（app+node+vitest）由 build-test 内 vue-tsc -b 覆盖
      - name: Typecheck (ci)
        run: bun run typecheck:ci

      - name: Lint (eslint + stylelint)
        run: bun run lint:check

      - name: i18n key check
        run: bun run i18n:check

      - name: Doc drift check
        run: bun run doc:check:all

      - name: Knip
        run: bun run knip

      - name: Extension tests
        run: cd extension && bun run test:run

      # 显性 must 门禁：不依赖 vitest 默认 include 是否仍扫到 eval（与 test:run 分计）
      - name: Recall eval must (explicit)
        run: |
          set -euo pipefail
          EVAL_TESTS=$(find extension/src/core/recall/eval -name '*.test.ts' | wc -l | tr -d ' ')
          echo "eval test files: ${EVAL_TESTS} (floor=${RECALL_EVAL_TEST_FILE_FLOOR})"
          if [ "${EVAL_TESTS}" -lt "${RECALL_EVAL_TEST_FILE_FLOOR}" ]; then
            echo "eval test files below floor — check include/exclude or directory move"
            exit 1
          fi
          cd extension && bun run test:must

      - name: Worker tests
        run: cd worker && bun run test

  build-test:
    name: Extension build
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile

      # CI 用 development build（含 vue-tsc -b）；发版用本地/手动 bun run --cwd extension build:prod
      - name: Build extension
        run: cd extension && bun run build

      # 扩展产物在仓库根 dist/（extension/vite OUT_DIR），不是 extension/dist
      - name: Verify dist
        run: |
          test -d dist || { echo "dist missing"; exit 1; }
          test -f dist/manifest.json || { echo "manifest.json missing"; exit 1; }
          test -f dist/background.js || { echo "background.js missing"; exit 1; }
          TOTAL_SIZE_KB=$(du -sk dist | cut -f1)
          echo "dist size: ${TOTAL_SIZE_KB}KB"
          echo "top js:"
          du -h dist/*.js 2>/dev/null | sort -hr | head -15 || true
          if [ "$TOTAL_SIZE_KB" -gt 20480 ]; then
            echo "exceeds Chrome Web Store 20MB limit"
            exit 1
          fi

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-${{ github.sha }}
          path: dist/
          retention-days: 7
