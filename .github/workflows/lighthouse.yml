name: Lighthouse CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse-frontend:
    name: Lighthouse - Frontend (Extension)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: bun install

      - name: Run Lighthouse CI - Frontend
        timeout-minutes: 10
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          LHCI_BUILD_TOKEN: ${{ secrets.LHCI_SERVER_TOKEN_FRONTEND }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: bun run audit:fe
        continue-on-error: true

      - name: Upload Frontend Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-frontend
          path: frontend/.lighthouseci/**
          retention-days: 7

  lighthouse-website:
    name: Lighthouse - Website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: bun install

      - name: Run Lighthouse CI - Website
        timeout-minutes: 15
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          LHCI_BUILD_TOKEN: ${{ secrets.LHCI_SERVER_TOKEN_WEBSITE }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: bun run audit:website
        continue-on-error: true

      - name: Upload Website Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-website
          path: website/.lighthouseci/**
          retention-days: 7
