name: Lighthouse CI

# v4 baseline：frontend/website 的 lighthouserc.json 已随 v3 剥离删除。
# 恢复审计配置前仅保留手动触发入口，避免 main push 空跑失败。
on:
  workflow_dispatch:

jobs:
  lighthouse-disabled:
    name: Lighthouse disabled (v4)
    runs-on: ubuntu-latest
    steps:
      - name: Skip until lighthouserc restored
        run: |
          echo "Lighthouse CI 已下线：缺少 frontend/lighthouserc.json 与 website/lighthouserc.json。"
          echo "恢复后请还原 audit:fe / audit:web 脚本并重新启用 push 触发。"
          exit 0
