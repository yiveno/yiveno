name = "yiveno"
main = "src/index.ts"
compatibility_date = "2026-07-31"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
# 每天北京时间 03:17（UTC 19:17）业务数据清理；每小时 :07 订阅对账（§A.3.2）
crons = ["17 19 * * *", "7 * * * *"]

# ===================== 可观测性配置（默认 / 非 production 部署）=====================
# 本地 `wrangler deploy`（无 --env）与开发：100% 采样，便于排障。
# 生产见下方 `[env.production.observability]`（更低采样控成本）。
# 注意：head sampling 按「整次调用」抽样；未抽中的请求（含失败）不会落 Workers Logs。
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# 追踪：单体 Worker 阶段默认关；流量大或跨服务排障再开
[observability.traces]
enabled = false
persist = false
head_sampling_rate = 0

# 本地 `wrangler dev`：Worker 代码在本机跑；binding 见各块 `remote`（勿用 `--local`，否则 Workers AI 不可用）。
# 默认部署用本段；生产见 [env.production]
# name 必须是 yiveno：`--env production` → 脚本名 yiveno-production。
# 若写成 yiveno-production 再加 --env production，会变成 yiveno-production-production。
[vars]
SUPABASE_URL = "https://ugxgxytykxblctsyulsg.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_2FY9uDfqNbLwUYXxgcu8lw_qQ8SEbXo"
REDIRECT_URI_ALLOWLIST = "https://yiveno.com,http://localhost:3001,http://localhost:3002"
AI_HOSTED_MODEL = "deepseek-v4-flash"
AI_HOSTED_MONTHLY_QUOTA = "999"
# 聊天补全 Provider（默认 deepseek；换厂商时改此值并实现对应 adapter）
AI_PROVIDER = "deepseek"
# 未配 AI Gateway 时的直连回退；配置了 AI_GATEWAY_* 后实际走 Gateway
DEEPSEEK_API_BASE = "https://api.deepseek.com"
# Cloudflare AI Gateway（Dashboard → AI → AI Gateway 创建名为 yiveno 的 gateway）
AI_GATEWAY_ACCOUNT_ID = "231a6a08dec7fe0133fbaac8c5e55b2a"
AI_GATEWAY_ID = "yiveno"
CLEANUP_SCHEDULED_ENABLED = "true"
CLEANUP_MEMORY_SYNC_BACKUPS_KEEP = "5"
CLEANUP_SOFT_DELETE_RETENTION_DAYS = "180"
DODO_PAYMENTS_ENVIRONMENT = "test_mode"
BILLING_FOUNDING_ENABLED = "false"
# 结构化反馈收件：须为 Email Routing 已验证 destination（非 feedback@ 别名）
FEEDBACK_TO_EMAIL = "hi.yiveno@gmail.com"

[[kv_namespaces]]
binding = "AI_USAGE_KV"
id = "7e3a0b3f52654b7194ed21015f1779c5"
preview_id = "1bc22ced5a424d55ad14ca9f748ba900"
# 开发：连 preview KV（配额/用量与线上一致）；生产 deploy 忽略此字段
remote = true

[ai]
binding = "AI"
# Workers AI 无本地模拟；`wrangler dev` 默认走远程（勿配合 `--local`）
remote = true

# 产品欢迎信 / 结构化反馈（§A.3 · 用户触点三轨）；不限制 destination
# remote=true：本地 wrangler dev 走真实 Email Sending（域未 onboard 时 send 失败只打日志）
[[send_email]]
name = "EMAIL"
remote = true

# Custom Domain 仅挂 production（`bun run deploy` → wrangler deploy --env production）。
# 顶层不声明 routes，避免默认/其它 env 误继承抢占域名。
[env.production]
workers_dev = true
routes = [{ pattern = "api.yiveno.com", custom_domain = true }]

# 生产：25% 采样（早期流量低、兼顾 webhook/对账排障；量上来可再降到 0.1）
# Metrics（请求量/错误率/延迟）仍全量，不受此影响。
[env.production.observability]
enabled = true
head_sampling_rate = 0.25

[env.production.observability.logs]
enabled = true
head_sampling_rate = 0.25
persist = true
invocation_logs = true

[env.production.observability.traces]
enabled = false
persist = false
head_sampling_rate = 0

[env.production.vars]
SUPABASE_URL = "https://ugxgxytykxblctsyulsg.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_2FY9uDfqNbLwUYXxgcu8lw_qQ8SEbXo"
REDIRECT_URI_ALLOWLIST = "https://yiveno.com,http://localhost:3001,http://localhost:3002"
AI_HOSTED_MODEL = "deepseek-v4-flash"
AI_HOSTED_MONTHLY_QUOTA = "999"
AI_PROVIDER = "deepseek"
DEEPSEEK_API_BASE = "https://api.deepseek.com"
AI_GATEWAY_ACCOUNT_ID = "231a6a08dec7fe0133fbaac8c5e55b2a"
AI_GATEWAY_ID = "yiveno"
CLEANUP_SCHEDULED_ENABLED = "true"
CLEANUP_MEMORY_SYNC_BACKUPS_KEEP = "5"
CLEANUP_SOFT_DELETE_RETENTION_DAYS = "180"
DODO_PAYMENTS_ENVIRONMENT = "test_mode"
BILLING_FOUNDING_ENABLED = "false"
FEEDBACK_TO_EMAIL = "hi.yiveno@gmail.com"

[[env.production.kv_namespaces]]
binding = "AI_USAGE_KV"
id = "7e3a0b3f52654b7194ed21015f1779c5"
preview_id = "1bc22ced5a424d55ad14ca9f748ba900"

[env.production.ai]
binding = "AI"

[[env.production.send_email]]
name = "EMAIL"
